name: Re-run red main once

# Re-runs the failed jobs of a red main run once, with this repository's own GITHUB_TOKEN (actions write is all it needs).
# Reverts stay with the central auto-revert, whose token opens PRs that start the required checks.
# Rule: ourostack/.github tools/red-main/README.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# The shared workflow declares contents and pull-requests write, and a caller cannot grant less; rerun-only mode uses none of it.
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  rerun:
    uses: ourostack/.github/.github/workflows/auto-revert-reusable.yml@main
    with:
      rerun-only: true
