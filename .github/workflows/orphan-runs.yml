name: Cancel orphaned merge-group runs

# A reformed merge queue leaves the old groups' merge_group runs going, and they hold the runners the live groups
# wait for. This cancels the runs whose group commit is no longer a queue entry, with this repository's own token.
# The rule: ourostack/.github tools/orphan-runs/README.md.
on:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel:
    permissions:
      actions: write
      contents: read
    uses: ourostack/.github/.github/workflows/orphan-runs-reusable.yml@main
