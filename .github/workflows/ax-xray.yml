name: Ouro AX X-ray

# The X-ray checks the CLI from outside, the way an agent calls it, and the action claims check the declarations
# in actions/. Both reports are uploaded: `xray` and `actions-xray`. The job fails when a must claim in either report
# does not hold, so a change that breaks one can't merge. Neither ever touches a real account: the CLI runs
# with an isolated home, no sync and no Teams or Outlook roots.

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  xray:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build the CLI
        run: go build -trimpath -o "$RUNNER_TEMP/bin/m365crawl" ./cmd/m365crawl
      - name: Inventory from the CLI's registration
        run: |
          "$RUNNER_TEMP/bin/m365crawl" help --json > "$RUNNER_TEMP/help.json"
          jq -e '{cli: [.commands[].name]}' "$RUNNER_TEMP/help.json" > "$RUNNER_TEMP/inventory.json"
      - name: Synthetic archive from the repository's Teams fixture
        run: |
          mkdir -p "$RUNNER_TEMP/xray-home" "$RUNNER_TEMP/fixture"
          cp -R testdata/teams-fixture "$RUNNER_TEMP/fixture/teams"
          HOME="$RUNNER_TEMP/xray-home" "$RUNNER_TEMP/bin/m365crawl" \
            --teams-root "$RUNNER_TEMP/fixture/teams/EBWebView" --outlook-root none sync --json > "$RUNNER_TEMP/sync.json"
      - name: Synthetic WorkIQ stub, the mock the writes call
        run: |
          mkdir -p "$RUNNER_TEMP/xray-home/bin"
          cp tools/ax-mock/workiq-stub.sh "$RUNNER_TEMP/xray-home/bin/workiq-stub"
          chmod 755 "$RUNNER_TEMP/xray-home/bin/workiq-stub"
      - name: Ouro AX X-ray
        run: |
          mkdir -p xray
          stub="$RUNNER_TEMP/xray-home/bin/workiq-stub"
          node tools/ouro-ax/xray.ts \
            --cli "$RUNNER_TEMP/bin/m365crawl" --name m365crawl \
            --inventory "$RUNNER_TEMP/inventory.json" \
            --home "$RUNNER_TEMP/xray-home" \
            --env M365CRAWL_NO_SYNC=1 \
            --env M365CRAWL_TEAMS_ROOT="$RUNNER_TEMP/xray-home/no-teams" \
            --env M365CRAWL_OUTLOOK_ROOT=none \
            --env M365CRAWL_WORKIQ_BIN="$stub" \
            --guard "tools/ax-mock/assert-stub.sh $stub" \
            --state "status --json" --state "whoami --json" --volatile archive_age_seconds \
            --sample "chat=19:00000000-0000-4000-8000-0000000000a1_00000000-0000-4000-8000-0000000000ff@unq.gbl.spaces" \
            --sample message=1700000061000 --sample to=ana@example.com \
            --sample "text=ax-xray probe" --sample "subject=ax-xray probe" --sample "reaction=👍" \
            --commit "$GITHUB_SHA" --json --md xray/xray.md > xray/report.json
          cp "$RUNNER_TEMP/inventory.json" xray/inventory.json
          node -e "const s = require('./xray/report.json').summary; if (!s) process.exit(1); if (s.mustHolding !== s.must) { console.error('X-ray: ' + s.mustHolding + ' of ' + s.must + ' must claims hold'); process.exit(1); }"
      - name: Action claims
        run: |
          mkdir -p xray-actions
          node tools/ouro-actions/ouro-actions.mts check actions/m365crawl.actions.mts actions/generated \
            --report xray-actions/report.json --app m365crawl --commit "$GITHUB_SHA"
          node -e "const s = require('./xray-actions/report.json').summary; if (!s) process.exit(1); if (s.mustHolding !== s.must) { console.error('Action claims: ' + s.mustHolding + ' of ' + s.must + ' must claims hold'); process.exit(1); }"
      - name: Upload the X-ray report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xray
          path: xray/
      - name: Upload the action claims report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actions-xray
          path: xray-actions/
