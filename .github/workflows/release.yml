name: Release

on:
  # Merging a release-notes file to main is the release. Nobody pushes a tag: the
  # decide job derives the version from the file the push added, and the release job
  # creates the tag. Pushing a tag by hand starts nothing.
  push:
    branches:
      - main
    paths:
      - "docs/releases/*.md"

permissions:
  contents: read

# One release at a time; a second push waits instead of cancelling a release in flight.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GOWORK: "off"

jobs:
  # Reads the push and decides: is this a release, and which version. It refuses a
  # push that is ambiguous or wrong (scripts/release-decide.sh). Every later job reads
  # the tag and commit from these outputs; none reads github.ref_name.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
      rehearsal: ${{ steps.decide.outputs.rehearsal }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Derive the release from the push
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release-decide.sh

  # A release publishes only a commit that passes every gate CI enforces: a failing check blocks the release.
  verify:
    needs: decide
    if: ${{ needs.decide.outputs.release == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Run every check
        run: make check

  release:
    needs: [decide, verify]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
          fetch-depth: 0
      - name: Create the tag at the released commit
        env:
          TAG: ${{ needs.decide.outputs.tag }}
          SHA: ${{ needs.decide.outputs.sha }}
        run: |
          # A tag made with GITHUB_TOKEN starts no other workflow, so the pipeline
          # continues in this run. On a re-run of this job the tag may already exist
          # at the same commit; at any other commit it is an error.
          existing="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)"
          if [ -z "$existing" ]; then
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/${TAG}"
          elif [ "$existing" != "$SHA" ]; then
            echo "::error::the tag ${TAG} already points at ${existing}, not ${SHA}"
            exit 1
          fi
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Require every Apple signing secret
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_CERTIFICATE_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/sign-notarize.sh --check-secrets
      - name: Pick release notes
        id: notes
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          if [ -f "docs/releases/${TAG}.md" ]; then
            cp "docs/releases/${TAG}.md" "$notes"
          else
            : > "$notes"
          fi
          printf '\nThe darwin binaries are Developer ID signed and notarized by Apple.\n' >> "$notes"
          echo "args=release --clean --release-notes=${notes}" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build the tag this run derived. Without it goreleaser picks a tag
          # from git describe, and a prerelease tag on the same commit (v0.1.0-rc.4
          # beside v0.1.0) made the v0.1.0 run rebuild and re-upload the rc.
          GORELEASER_CURRENT_TAG: ${{ needs.decide.outputs.tag }}
          # scripts/sign-notarize.sh fails the build when any is missing or any gate fails.
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_CERTIFICATE_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # publish-homebrew pushes this cask to the tap once the release verifies. Every
      # release carries one, a rehearsal included: goreleaser renders it for the rc tag
      # (version and URLs of the rc), and publish-homebrew puts a rehearsal's cask on the
      # tap's rehearsal branch, never on main.
      - name: Attach Homebrew cask to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: gh release upload "$TAG" dist/homebrew/Casks/teamscrawl.rb --clobber

  # Verifies the published artifacts exactly as a user downloads them.
  verify-release:
    needs: [decide, release]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - name: Verify the published darwin artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.decide.outputs.tag }}
          REPO: ${{ github.repository }}
          EXPECT_COMMIT: ${{ needs.decide.outputs.sha }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/verify-release.sh

  # Pushes the cask to ourostack/homebrew-tap with a deploy key that can write to that
  # one repository, and only after the published artifacts verify. A stable release
  # goes to the tap's main, which is what users install. A rehearsal goes to the
  # branch "rehearsal", so the real key and the real push are exercised without
  # changing what users install.
  publish-homebrew:
    needs: [decide, verify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - name: Push the cask to the tap
        env:
          TAG: ${{ needs.decide.outputs.tag }}
          TAP_BRANCH: ${{ needs.decide.outputs.rehearsal == 'true' && 'rehearsal' || 'main' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: scripts/publish-cask.sh

  # Stable releases only: installs from the tap the way a user does and checks the installed binary.
  verify-homebrew:
    if: ${{ needs.decide.outputs.rehearsal == 'false' }}
    needs: [decide, publish-homebrew]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - name: Wait for the tap, install the cask and verify it
        env:
          TAG: ${{ needs.decide.outputs.tag }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: scripts/verify-homebrew.sh

  # Containment: a release whose downloaded artifacts failed verification must not stay
  # "latest". Marking it a prerelease takes it out of what users and `brew` resolve as the newest.
  contain:
    if: ${{ always() && needs.verify-release.result == 'failure' }}
    needs: [decide, verify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Mark the release as a prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.decide.outputs.tag }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" -R "$REPO" --prerelease --latest=false

  # Reporting: any failed job opens an issue, or comments on the open one with the same title.
  report-failure:
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs: [decide, verify, release, verify-release, publish-homebrew, verify-homebrew, contain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          VERSION: ${{ needs.decide.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/report-failure.sh
