name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  # A tag reruns the macOS check gate on the tagged commit before publishing. Windows test,
  # e2e and coverage gates are enforced in pull-request CI, and the published Windows artifacts
  # are verified below before any stable-tag cask publish.
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Run every check
        run: make check

  release:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Require every Apple signing secret
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_CERTIFICATE_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/sign-notarize.sh --check-secrets
      - name: Pick release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          if [ -f "docs/releases/${TAG}.md" ]; then
            cp "docs/releases/${TAG}.md" "$notes"
          else
            : > "$notes"
          fi
          printf '\nThe darwin binaries are Developer ID signed and notarized by Apple.\n' >> "$notes"
          printf 'The Windows binaries are unsigned.\n' >> "$notes"
          echo "args=release --clean --release-notes=${notes}" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build the tag that triggered this run. Without it goreleaser picks a tag
          # from git describe, and a prerelease tag on the same commit (v0.1.0-rc.4
          # beside v0.1.0) made the v0.1.0 run rebuild and re-upload the rc.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # scripts/sign-notarize.sh fails the build when any is missing or any gate fails.
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_CERTIFICATE_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # publish-homebrew pushes this cask to the tap once the release verifies. A prerelease
      # (a tag with a hyphen, such as v0.1.0-rc.2) carries no cask, so it never reaches the tap.
      - name: Attach Homebrew cask to the release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/homebrew/Casks/teamscrawl.rb --clobber

  # Verifies the published artifacts exactly as a user downloads them.
  verify-release-darwin:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the published darwin artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          EXPECT_COMMIT: ${{ github.sha }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/verify-release.sh

  verify-release-windows:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
    name: verify-release-windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the published Windows artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          EXPECT_COMMIT: ${{ github.sha }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: scripts/verify-release.ps1

  # Stable tags only: a prerelease never reaches the tap. Publishing is part of this
  # pipeline: the job pushes the cask to ourostack/homebrew-tap with a deploy key that
  # can write to that one repository, and only after the published darwin and Windows
  # artifacts verify.
  publish-homebrew:
    if: ${{ !contains(github.ref_name, '-') }}
    needs:
      - verify-release-darwin
      - verify-release-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Push the cask to the tap
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: scripts/publish-cask.sh

  # Installs from the tap the way a user does and checks the installed binary.
  verify-homebrew:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish-homebrew
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the tap, install the cask and verify it
        env:
          TAG: ${{ github.ref_name }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: scripts/verify-homebrew.sh
