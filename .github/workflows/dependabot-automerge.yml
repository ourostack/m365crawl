name: Dependabot auto-merge

# Turns on auto-merge (squash) for Dependabot pull requests, so each merges when the
# required checks pass. pull_request_target gives a Dependabot pull request a token that
# can write; this workflow never checks out or runs the pull request's code.
on:
  pull_request_target:

permissions: {}

jobs:
  automerge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
