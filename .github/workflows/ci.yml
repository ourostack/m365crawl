name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs not triggered by a pull request each
# get their own group, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: "off"

jobs:
  # The merge queue builds the pull request's commit on top of the current main. When that commit
  # has exactly the tree the pull request's own passing run already tested, a second full run adds
  # nothing, so the queue skips the jobs below and `ci-ok` accepts the pull request run's result.
  # Any difference (main moved, an earlier entry in the queue) or any doubt (no run found, an API
  # failure) leaves `skip` unset and the full run happens. Pushes to main always run in full.
  gate:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Does a passing pull request run already cover this tree?
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          QUEUE_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          head_sha="${HEAD_REF##*-}"
          queue_tree="$(gh api "repos/$REPO/git/commits/$QUEUE_SHA" --jq .tree.sha)"
          run_id="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head_sha&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "no passing pull request run for $head_sha: full run"
            exit 0
          fi
          tested_tree="$(gh api "repos/$REPO/actions/runs/$run_id/artifacts?name=tested-tree" --jq '.artifacts[0].name // empty')"
          if [ -z "$tested_tree" ]; then
            echo "run $run_id recorded no tree: full run"
            exit 0
          fi
          artifact_id="$(gh api "repos/$REPO/actions/runs/$run_id/artifacts?name=tested-tree" --jq '.artifacts[0].id')"
          gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > tree.zip
          recorded="$(unzip -p tree.zip tree.txt | tr -d '[:space:]')"
          if [ "$recorded" = "$queue_tree" ]; then
            echo "queue tree $queue_tree was tested by run $run_id: skipping the repeat"
            echo skip=true >> "$GITHUB_OUTPUT"
          else
            echo "queue tree $queue_tree differs from the tested tree $recorded: full run"
          fi

  lint:
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: No leftover names from before the rename
        run: |
          old='teamscra''wl'
          fail=0
          hits="$(git grep -nIi "$old" || true)"
          if [ -n "$hits" ]; then
            echo "$hits" >&2
            fail=1
          fi
          paths="$(git ls-files | grep -i "$old" || true)"
          if [ -n "$paths" ]; then
            echo "$paths" >&2
            fail=1
          fi
          if [ "$fail" = 1 ]; then
            echo 'remove the old product name; no file and no file name may carry it' >&2
            exit 1
          fi
      # Pull requests add a fragment in changes/ instead of editing CHANGELOG.md, so two open
      # pull requests never conflict on the [Unreleased] lines. A release pull request passes:
      # scripts/changelog-assemble.sh moves the fragments into its version section.
      - name: Changelog entries are fragments in changes/
        run: scripts/changelog-assemble.sh --check
      - name: Check tidy, format, vet and lint
        run: make tidy-check fmt-check vet lint
      # A feature schema number picked when a pull request opened may since have been used on the
      # base branch (#306). Pull requests check against their base commit, and the merge queue
      # against the queue's base, which is what the change will land on.
      - name: Schema numbers are free on the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            go run ./scripts/schemaguard "$BASE_SHA"
          else
            go run ./scripts/schemaguard
          fi

  # Each platform runs the unit tests once. Linux runs them with the race detector, split over
  # several runners because the detector makes them several times slower. macOS and Windows run
  # them without it, write a coverage profile, and enforce their coverage gate from that profile.
  #
  # A macOS runner waits 20 to 80 minutes for a slot and then works for about 14, so pull requests
  # skip the macOS leg; the merge queue and pushes to main run it, and nothing reaches main without
  # it (#335). The macOS leg also runs the macOS end-to-end tests, so a run waits for one macOS
  # runner, not two. The Unix 100% coverage gate is in that leg: run `make coverage` before a pull
  # request, or the queue finds the gap.
  test:
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(format('[{0}{1}]', '{"name":"ubuntu-latest race 1/8","os":"ubuntu-latest","shard":1},{"name":"ubuntu-latest race 2/8","os":"ubuntu-latest","shard":2},{"name":"ubuntu-latest race 3/8","os":"ubuntu-latest","shard":3},{"name":"ubuntu-latest race 4/8","os":"ubuntu-latest","shard":4},{"name":"ubuntu-latest race 5/8","os":"ubuntu-latest","shard":5},{"name":"ubuntu-latest race 6/8","os":"ubuntu-latest","shard":6},{"name":"ubuntu-latest race 7/8","os":"ubuntu-latest","shard":7},{"name":"ubuntu-latest race 8/8","os":"ubuntu-latest","shard":8}', github.event_name != 'pull_request' && github.event_name != 'merge_group' && ',{"name":"windows-latest","os":"windows-latest","coverprofile":"coverage-windows.out"},{"name":"macos-latest","os":"macos-latest","coverprofile":"coverage.out","e2e":true}' || '')) }}
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.e2e && 25 || 20 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Windows Defender scans every file the tests write, and the tests write thousands of
      # archives, snapshots and test binaries: on a throwaway runner that only slows them down.
      # The tests' temporary files go on the runner's faster work drive too.
      - name: Speed up file access on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Test with the race detector
        if: matrix.shard
        run: make test-shard SHARD=${{ matrix.shard }} SHARDS=8
      - name: Test with coverage
        if: matrix.coverprofile
        shell: bash
        run: go test -count=1 -timeout 15m -coverprofile=${{ matrix.coverprofile }} ./...
      - name: Enforce 100% function coverage
        if: runner.os == 'macOS'
        env:
          COVERAGE_PROFILE: ${{ matrix.coverprofile }}
        run: ./scripts/check-coverage.sh
      - name: Enforce Windows coverage gate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COVERAGE_PROFILE: ${{ matrix.coverprofile }}
        run: scripts/check-coverage.ps1
      - name: Windows release checksum regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/verify-release_test.ps1
      - name: Test vectors match the generator
        if: matrix.coverprofile
        run: go test -count=1 -v -run 'TestGeneratorIsCurrent$' ./internal/v8
      - name: Coverage summary
        if: matrix.coverprofile
        shell: bash
        run: |
          {
            echo "### Coverage (${{ matrix.os }})"
            echo
            echo '```'
            go tool cover -func=${{ matrix.coverprofile }} | tail -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: End-to-end tests
        if: matrix.e2e
        env:
          # macOS runners have Edge: the real-browser test must run there, not skip.
          M365CRAWL_REQUIRE_BROWSER: "1"
        run: make e2e

  # The macOS end-to-end tests run in the macOS test leg above.
  e2e:
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(format('[{0}{1}]', '{"os":"ubuntu-latest","e2e-command":"make e2e","require-browser":""}', github.event_name != 'pull_request' && github.event_name != 'merge_group' && ',{"os":"windows-latest","e2e-command":"go test -count=1 -tags e2e ./e2e/...","require-browser":"1"}' || '')) }}
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: End-to-end tests
        shell: bash
        env:
          # Windows runners have Edge: the real-browser test must run there, not skip.
          M365CRAWL_REQUIRE_BROWSER: ${{ matrix.require-browser }}
        run: ${{ matrix.e2e-command }}

  release-check:
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Snapshot release build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean --skip=publish
      - name: Verify release artifacts
        shell: pwsh
        run: scripts/check-release-artifacts.ps1

  # The one check branch protection and the merge queue require. It passes only when every job
  # above succeeded, so adding or renaming a job never needs a branch protection change. A job is
  # skipped only when the merge queue's gate proved the queue commit's tree already passed in the
  # pull request run; any other skipped job (a failed dependency, say) fails this check too.
  ci-ok:
    if: always()
    needs:
      - gate
      - lint
      - test
      - e2e
      - release-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          GATE: ${{ needs.gate.result }}
          SKIPPED: ${{ needs.gate.outputs.skip }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          E2E: ${{ needs.e2e.result }}
          RELEASE: ${{ needs.release-check.result }}
        run: |
          echo "$RESULTS"
          # The gate runs only in the merge queue, so it is "skipped" everywhere else.
          [ "$GATE" = success ] || [ "$GATE" = skipped ]
          for result in "$LINT" "$TEST" "$E2E" "$RELEASE"; do
            # Only a gate that proved the tree was already tested may leave a job skipped.
            [ "$result" = success ] || { [ "$SKIPPED" = true ] && [ "$GATE" = success ] && [ "$result" = skipped ]; }
          done
      - name: Record the tree this pull request run tested
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.sha }}
        run: gh api "repos/$REPO/git/commits/$TESTED_SHA" --jq .tree.sha > tree.txt
      - name: Upload the tested tree
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree
          path: tree.txt
          retention-days: 7
