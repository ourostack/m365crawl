name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: No leftover names from before the rename
        run: |
          old='teamscra''wl'
          fail=0
          # The README's one "formerly" note, matched as the whole line, is the only allowed mention outside history.
          allowed="m365crawl was called ${old} before v0.5.0; it has no alias for the old name."
          hits="$(git grep -nIi "$old" -- . ':!CHANGELOG.md' ':!docs/releases/' | awk -v allowed="$allowed" '{ line = $0; sub(/^README\.md:[0-9]+:/, "") } line !~ /^README\.md:[0-9]+:/ || $0 != allowed { print line }')"
          if [ -n "$hits" ]; then
            echo "$hits" >&2
            fail=1
          fi
          paths="$(git ls-files | grep -i "$old" | grep -v '^docs/releases/' || true)"
          if [ -n "$paths" ]; then
            echo "$paths" >&2
            fail=1
          fi
          if [ "$fail" = 1 ]; then
            echo 'the product was renamed to m365crawl; remove the old name (CHANGELOG.md and docs/releases/ keep history)' >&2
            exit 1
          fi
      - name: Check tidy, format, vet and lint
        run: make tidy-check fmt-check vet lint

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            test-command: make test COVERPROFILE=coverage.out
            coverprofile: coverage.out
          - os: ubuntu-latest
            test-command: make test COVERPROFILE=coverage.out
            coverprofile: coverage.out
          - os: windows-latest
            test-command: go test -race -count=1 -timeout 25m -coverprofile=coverage-windows.out ./...
            coverprofile: coverage-windows.out
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Test
        shell: bash
        run: ${{ matrix.test-command }}
      - name: Windows release checksum regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/verify-release_test.ps1
      - name: Test vectors match the generator
        run: go test -count=1 -v -run 'TestGeneratorIsCurrent$' ./internal/v8
      - name: Coverage summary
        shell: bash
        run: |
          {
            echo "### Coverage (${{ matrix.os }})"
            echo
            echo '```'
            go tool cover -func=${{ matrix.coverprofile }} | tail -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: coverage
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Enforce 100% function coverage
        run: make coverage

  coverage-windows:
    name: coverage-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Enforce Windows coverage gate
        shell: pwsh
        run: scripts/check-coverage.ps1

  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            e2e-command: make e2e
            require-browser: "1"
          - os: ubuntu-latest
            e2e-command: make e2e
            require-browser: ""
          - os: windows-latest
            e2e-command: go test -count=1 -tags e2e ./e2e/...
            require-browser: "1"
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: End-to-end tests
        shell: bash
        env:
          # macOS and Windows runners have Edge: the real-browser test must run there, not skip.
          M365CRAWL_REQUIRE_BROWSER: ${{ matrix.require-browser }}
        run: ${{ matrix.e2e-command }}

  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Snapshot release build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean --skip=publish
      - name: Verify release artifacts
        shell: pwsh
        run: scripts/check-release-artifacts.ps1
