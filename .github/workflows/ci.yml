name: CI

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact product source commit
        required: true
        type: string
      operation:
        description: Synthetic probe or complete release-equivalent verification
        required: true
        type: choice
        options:
          - transcript-probe
          - release-gate-verify
          - lint-diagnostic

permissions:
  contents: read

env:
  GOWORK: "off"
  M365CRAWL_REAL_CACHE: "0"

jobs:
  transcript-probe:
    if: inputs.operation == 'transcript-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate exact source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run synthetic transcript regressions
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, subprocess, time
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "transcript-probe"
          root.mkdir()
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["SOURCE_SHA"]
          commands = [
              ["go", "test", "-count=1", "-timeout=5m", "-v", "./internal/cli", "-run=^TestShowCoverage"],
              ["go", "test", "-count=1", "-timeout=5m", "-v", "./internal/transcripts"],
          ]
          results = []
          for i, command in enumerate(commands):
              start = time.monotonic()
              with (root / ("probe-" + str(i) + ".log.txt")).open("w") as log:
                  process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  for line in process.stdout:
                      print(line, end="", flush=True)
                      log.write(line)
                  code = process.wait()
              results.append(dict(command=command, elapsed=time.monotonic()-start, code=code))
          (root / "results.json").write_text(json.dumps(dict(source=os.environ["SOURCE_SHA"], runner=platform.platform(), results=results), indent=2))
          raise SystemExit(any(r["code"] for r in results))
          PY
      - name: Preserve source-bound synthetic output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcript-probe
          path: ${{ runner.temp }}/transcript-probe
          if-no-files-found: error

  release-gate-verify:
    if: inputs.operation == 'release-gate-verify' || inputs.operation == 'lint-diagnostic'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        gate: ${{ fromJSON(inputs.operation == 'lint-diagnostic' && '["lint"]' || '["nonrace","race-1","race-2","race-3","race-4"]') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Validate exact source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install shellcheck
        if: matrix.gate == 'nonrace' || matrix.gate == 'lint'
        run: brew install shellcheck
      - name: Run exact selected diagnostic or verification command
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GATE: ${{ matrix.gate }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, subprocess, time
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-gate-verify"
          root.mkdir()
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["SOURCE_SHA"]
          gate = os.environ["GATE"]
          command = ["make", "tidy-check", "fmt-check", "vet", "lint", "coverage", "e2e"] if gate == "nonrace" else ["make", "test-shard", "SHARD=" + gate[-1], "SHARDS=4"]
          if gate == "lint":
              command = ["make", "tidy-check", "fmt-check", "vet", "lint"]
          start = time.monotonic()
          with (root / (gate + ".log.txt")).open("w") as log:
              process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              for line in process.stdout:
                  print(line, end="", flush=True)
                  log.write(line)
              code = process.wait()
          (root / (gate + ".json")).write_text(json.dumps(dict(source=os.environ["SOURCE_SHA"], runner=platform.platform(), command=command, elapsed=time.monotonic()-start, code=code), indent=2))
          raise SystemExit(code)
          PY
      - name: Preserve exact gate logs and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gate-${{ matrix.gate }}
          path: ${{ runner.temp }}/release-gate-verify
          if-no-files-found: error
