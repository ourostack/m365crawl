name: CI

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact product source for the selected cost regression probe
        required: true
        type: string

permissions:
  contents: read

env:
  GOWORK: "off"
  M365CRAWL_REAL_CACHE: "0"

jobs:
  syncer-cost-probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Validate source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Exercise unchanged failure samples and fixture safety
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, subprocess, time
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "syncer-cost-probe"
          root.mkdir()
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert source == os.environ["SOURCE_SHA"]
          names = [
              "TestWorkIQEveryFetchFailureRecordsItsAttemptAndResult",
              "TestWorkIQMailRecheckLargerThanTheCapContinuesAcrossRuns",
              "TestWorkIQExpiredRestartThenPageLimitIsResumable",
              "TestWorkIQMailRecheckContinuesAfterEveryResumableStopAndFailedStart",
              "TestWorkIQBoundaryFixtureRetainsNativeLocksCancellationAndReadOnlyAccess",
          ]
          command = [
              "go", "test", "-count=1", "-timeout=10m", "-json",
              "-coverprofile=" + str(root / "syncer.cover.out"),
              "-run=^(" + "|".join(names) + ")$", "./internal/syncer",
          ]
          start = time.monotonic()
          events = []
          with (root / "events.jsonl").open("w") as log:
              process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              for line in process.stdout:
                  log.write(line)
                  print(line, end="", flush=True)
                  if line.startswith("{"):
                      event = json.loads(line)
                      if event.get("Test") and event.get("Action") in ("pass", "fail", "skip"):
                          events.append({key: event[key] for key in ("Test", "Action", "Elapsed") if key in event})
              code = process.wait()
          (root / "results.json").write_text(json.dumps(dict(
              source=source, runner=platform.platform(), command=command,
              code=code, elapsed=time.monotonic()-start, tests=events,
              qualification="selected regression probe, not full coverage or release qualification",
          ), indent=2))
          raise SystemExit(code)
          PY
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syncer-cost-probe
          path: ${{ runner.temp }}/syncer-cost-probe
          if-no-files-found: error
