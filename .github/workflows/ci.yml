name: Selected image diagnostic

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact product commit to exercise
        required: true
        type: string
      group:
        description: Fixed diagnostic selection
        required: true
        type: choice
        options:
          - inventory-entrypoint
          - inventory-cli
          - inventory
          - inventory-complete
          - images-complete
          - transport
          - png
          - publisher
          - orchestration
          - coverage
          - media-goldens

permissions:
  contents: read

concurrency:
  group: image-probe-${{ github.run_id }}
  cancel-in-progress: false

env:
  GOWORK: "off"
  M365CRAWL_REAL_CACHE: "0"

jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: ${{ fromJSON(inputs.group == 'publisher' && '["ubuntu-latest","macos-latest","windows-latest"]' || (inputs.group == 'inventory-complete' || inputs.group == 'images-complete') && '["macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate exact source and fixed diagnostic group
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PROBE_GROUP: ${{ inputs.group }}
        run: |
          python3 - <<'PY'
          import os, re
          allowed = {"inventory-entrypoint", "inventory-cli", "inventory", "inventory-complete", "images-complete", "transport", "png",
                     "publisher", "orchestration", "coverage", "media-goldens"}
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_SHA"]) or os.environ["PROBE_GROUP"] not in allowed:
              raise SystemExit("invalid source or diagnostic group")
          PY
      - name: Checkout exact product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run fixed diagnostic and retain actual outcome
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PROBE_GROUP: ${{ inputs.group }}
          HELPER_SHA: ${{ github.sha }}
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, time
          groups = {
              "inventory-entrypoint": (["./internal/cli"], "^TestImageInventoryContentAndEmoji$"),
              "inventory-cli": (["./internal/cli"], "^(TestImageInventory|TestImageSelection|TestImageSelector|TestImageOffline)"),
              "inventory": (["./internal/teamsimage", "./internal/cli", "./internal/store"], "^(TestImageInventory|TestImageSelection|TestImageSelector|TestImageOffline)"),
              "inventory-complete": (["./internal/teamsimage", "./internal/cli", "./internal/store"], "^Test"),
              "images-complete": (["./internal/teamsimage", "./internal/cli", "./internal/store", "./internal/workiq",
                                   "./internal/fileprivacy", "./internal/imageexport", "./internal/snapshotowner", "./internal/syncer"], "^Test"),
              "transport": (["./internal/workiq"], "^(TestChatImage|TestSelectedImageMessage|TestDecodeBlob|TestDocument)"),
              "png": (["./internal/teamsimage"], "^TestImagePNG"),
              "publisher": (["./internal/fileprivacy", "./internal/imageexport", "./internal/snapshotowner"], "^(TestImage|TestOwner|TestPrivate|TestSnapshotOwner)"),
              "orchestration": (["./internal/syncer", "./internal/cli"], "^(TestFetchChatImage|TestImageFetch|TestImagePublished|TestImageOutcome|TestWorkIQDocument|TestFetchWorkIQDocument|TestContentFetchDoc|TestJudgeDocument|TestJudgeBytes|TestDocumentAccount)"),
              "coverage": (["./internal/cli"], "^(TestMessageMediaCoverage|TestImageHelp|TestMessageApplication|TestApplication|TestCalendarApp|TestShowCoverage|TestTextTruncatesToTerminalWidth|TestHelpSaysTeamsOnlyWhenItMeansTeams|TestSkillNamesOnlyWhatExists|TestInstalledWorkflowDisclosureActualEmbeddedGuide)"),
              "media-goldens": (["./internal/cli"], "^(Test.*Golden|TestCommandsDocListsFields|TestSearchTextOutputs|TestSearchTranscriptsTextOutput)"),
          }
          out = pathlib.Path("image-probe-output")
          out.mkdir()
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          requested = os.environ["SOURCE_SHA"]
          if actual != requested:
              raise SystemExit("checkout does not match requested source")
          packages, pattern = groups[os.environ["PROBE_GROUP"]]
          command = ["go", "test", "-json", "-count=1", "-timeout=5m",
                     "-coverprofile=image-probe-output/coverage.out", *packages, "-run", pattern]
          if os.environ["PROBE_GROUP"] == "media-goldens":
              command.append("-update")
          if os.environ["PROBE_GROUP"] in ("inventory-complete", "images-complete"):
              command = ["go", "test", "-json", "-count=1", "-timeout=15m",
                         "-coverprofile=image-probe-output/coverage.out", *packages]
          manifest = {
              "source": actual, "helper": os.environ["HELPER_SHA"],
              "group": os.environ["PROBE_GROUP"], "runner": os.environ["RUNNER_LABEL"],
              "command": command, "gowork": os.environ["GOWORK"],
              "real_cache": os.environ["M365CRAWL_REAL_CACHE"],
          }
          manifest_path = out / "manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest), flush=True)
          started = time.monotonic()
          with (out / "tests.jsonl").open("w") as log:
              result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
          terminal = []
          for line in (out / "tests.jsonl").read_text(errors="replace").splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get("Test") and event.get("Action") in ("pass", "fail", "skip"):
                  terminal.append({key: event.get(key) for key in ("Package", "Test", "Action", "Elapsed")})
          manifest.update(exit_code=result.returncode, elapsed_seconds=time.monotonic()-started,
                          terminal_tests=terminal)
          if os.environ["PROBE_GROUP"] == "media-goldens":
              generated = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
              if any(path != "docs/commands.md" and not path.startswith("internal/cli/testdata/") for path in generated):
                  raise SystemExit("golden generation changed an unapproved path")
              with (out / "generated.patch").open("wb") as patch:
                  subprocess.run(["git", "diff", "--binary", "--", "docs/commands.md", "internal/cli/testdata"],
                                 stdout=patch, check=True)
              manifest["generated_paths"] = generated
              manifest["generated_patch"] = "generated.patch"
          if os.environ["PROBE_GROUP"] in ("inventory-complete", "images-complete") and result.returncode == 0:
              coverage_started = time.monotonic()
              env = dict(os.environ, COVERAGE_PROFILE="image-probe-output/coverage.out",
                         COVERAGE_PACKAGES=" ".join(packages))
              with (out / "coverage-gate.txt").open("w") as log:
                  coverage = subprocess.run(["bash", "scripts/check-coverage.sh"], env=env,
                                            stdout=log, stderr=subprocess.STDOUT)
              manifest["coverage_command"] = ["bash", "scripts/check-coverage.sh"]
              manifest["coverage_exit_code"] = coverage.returncode
              manifest["coverage_elapsed_seconds"] = time.monotonic()-coverage_started
          if (out / "coverage.out").is_file():
              with (out / "coverage-functions.txt").open("w") as log:
                  functions = subprocess.run(["go", "tool", "cover", "-func=image-probe-output/coverage.out"],
                                             stdout=log, stderr=subprocess.STDOUT)
              manifest["coverage_functions_exit_code"] = functions.returncode
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          lines = (out / "tests.jsonl").read_text(errors="replace").splitlines()
          print("\n".join(lines[-40:]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("```json\n" + json.dumps(manifest, indent=2) + "\n```\n")
          image_prefixes = ("TestImage", "TestChatImage", "TestSelectedImageMessage",
                            "TestFetchChatImage", "TestMessageMediaCoverage")
          exercised = [event for event in terminal
                       if event["Action"] != "skip" and event["Test"].startswith(image_prefixes)]
          if os.environ["PROBE_GROUP"] == "media-goldens":
              required = {"TestTextGoldens", "TestCalendarTextGoldens", "TestMetadataGolden", "TestCommandsDocListsFields",
                          "TestSearchTextOutputs", "TestSearchTranscriptsTextOutput"}
              exercised = [event for event in terminal if event["Action"] != "skip" and event["Test"] in required]
              if {event["Test"] for event in exercised} != required:
                  raise SystemExit("required golden generators did not execute")
          if not exercised:
              raise SystemExit("no named diagnostic tests executed; not a behavioral verdict")
          raise SystemExit(result.returncode or manifest.get("coverage_exit_code", 0)
                           or manifest.get("coverage_functions_exit_code", 0))
          PY
      - name: Retain complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ inputs.group }}-${{ matrix.os }}
          path: image-probe-output/
          if-no-files-found: error
