version: 2

project_name: teamscrawl

builds:
  - id: teamscrawl
    main: ./cmd/teamscrawl
    binary: teamscrawl
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/ourostack/teamscrawl/internal/cli.version={{ .Version }}

archives:
  - id: bundles
    ids:
      - teamscrawl
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release:
  prerelease: auto

homebrew_casks:
  - name: teamscrawl
    ids:
      - bundles
    binaries:
      - teamscrawl
    directory: Casks
    homepage: https://github.com/ourostack/teamscrawl
    description: Mirror the Microsoft Teams desktop cache into local SQLite for agents. Read-only, offline, no tokens.
    license: MIT
    # Publish prereleases (vX.Y.Z-alpha.N) too; the default "auto" would skip them.
    skip_upload: false
    commit_author:
      name: Ari Mendelow
      email: 16390116+arimendelow@users.noreply.github.com
    repository:
      owner: ourostack
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:ourostack/homebrew-tap.git
        private_key: '{{ index .Env "HOMEBREW_TAP_DEPLOY_KEY" }}'
    # The binary is unsigned until an Apple identity is wired into CI.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/teamscrawl"]
          end
