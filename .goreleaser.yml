version: 2

project_name: m365crawl

builds:
  - id: m365crawl-darwin
    main: ./cmd/m365crawl
    binary: m365crawl
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/ourostack/m365crawl/internal/cli.version={{ .Version }} -X github.com/ourostack/m365crawl/internal/cli.commit={{ .Commit }} -X github.com/ourostack/m365crawl/internal/cli.date={{ .Date }}
    # Developer ID sign and notarize each binary before it is archived, so the
    # archives, checksums and cask sha256 all describe the signed binary. The
    # script fails the build unless every Apple secret is set and every gate passes.
    hooks:
      post:
        # Snapshots (make snapshot, the PR build job) are never published, so they skip signing.
        # A tagged release is never a snapshot, so it always signs.
        - cmd: '{{ if .IsSnapshot }}{{ if eq .Runtime.Goos "windows" }}cmd /c exit 0{{ else }}true{{ end }}{{ else }}scripts/sign-notarize.sh "{{ .Path }}"{{ end }}'
  - id: m365crawl-windows
    main: ./cmd/m365crawl
    binary: m365crawl
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/ourostack/m365crawl/internal/cli.version={{ .Version }} -X github.com/ourostack/m365crawl/internal/cli.commit={{ .Commit }} -X github.com/ourostack/m365crawl/internal/cli.date={{ .Date }}

archives:
  - id: darwin-bundles
    ids:
      - m365crawl-darwin
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
  - id: windows-bundles
    ids:
      - m365crawl-windows
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release:
  # Tags with a hyphen (v0.1.0-rc.2) are GitHub prereleases and never become "latest".
  prerelease: auto
  make_latest: auto

homebrew_casks:
  - name: m365crawl
    ids:
      - darwin-bundles
    binaries:
      - m365crawl
    directory: Casks
    homepage: https://github.com/ourostack/m365crawl
    description: Mirror the Microsoft Teams desktop cache into local SQLite for agents. Read-only, offline, no tokens.
    license: MIT
    # The tap pulls the rendered cask from the release asset m365crawl.rb
    # (uploaded by release.yml), so goreleaser never pushes to the tap.
    skip_upload: true
    commit_author:
      name: Ari Mendelow
      email: 16390116+arimendelow@users.noreply.github.com
    repository:
      owner: ourostack
      name: homebrew-tap
    # Releases are Developer ID signed and notarized, so this quarantine removal
    # is unnecessary. It stays because it is harmless.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/m365crawl"]
          end
