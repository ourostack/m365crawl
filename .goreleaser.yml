version: 2

project_name: teamscrawl

builds:
  - id: teamscrawl
    main: ./cmd/teamscrawl
    binary: teamscrawl
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/ourostack/teamscrawl/internal/cli.version={{ .Version }}
    # Developer ID sign and notarize each binary before it is archived, so the
    # archives, checksums and cask sha256 all describe the signed binary. The
    # script is a no-op when the Apple signing secrets are not available.
    hooks:
      post:
        - cmd: scripts/sign-notarize.sh "{{ .Path }}"

archives:
  - id: bundles
    ids:
      - teamscrawl
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release:
  prerelease: auto

homebrew_casks:
  - name: teamscrawl
    ids:
      - bundles
    binaries:
      - teamscrawl
    directory: Casks
    homepage: https://github.com/ourostack/teamscrawl
    description: Mirror the Microsoft Teams desktop cache into local SQLite for agents. Read-only, offline, no tokens.
    license: MIT
    # The tap pulls the rendered cask from the release asset teamscrawl.rb
    # (uploaded by release.yml), so goreleaser never pushes to the tap.
    skip_upload: true
    commit_author:
      name: Ari Mendelow
      email: 16390116+arimendelow@users.noreply.github.com
    repository:
      owner: ourostack
      name: homebrew-tap
    # Signed releases are Developer ID signed and notarized, so this quarantine
    # removal is unnecessary for them. It stays because it is harmless and
    # releases built without signing secrets are still unsigned.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/teamscrawl"]
          end
