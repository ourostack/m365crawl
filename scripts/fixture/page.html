<!doctype html>
<meta charset="utf-8">
<title>m365crawl fixture</title>
<script>
// Synthetic data only. Builds one account's Teams-shaped IndexedDB databases.
const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const done = (tx) => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
const open = (name, stores) => new Promise((res, rej) => {
  const r = indexedDB.open(name, 1);
  r.onupgradeneeded = () => { for (const [s, kp] of stores) r.result.createObjectStore(s, { keyPath: kp }); };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});

// Deterministic PRNG so regeneration is stable apart from browser-side timestamps.
function rng(seed) { let s = seed >>> 0; return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296); }

function msg(acct, convId, n, over) {
  const id = String(1700000000000 + n * 1000);
  return Object.assign({
    id, conversationId: convId, parentMessageId: id, clientMessageId: String(9000000000 + n),
    version: 1700000000000 + n * 1000, sequenceId: n, messageType: 'RichText/Html', contentType: 'Text',
    content: '<p>Fixture message ' + n + '</p>', imDisplayName: acct.name, creator: '8:orgid:' + acct.user,
    originalArrivalTime: 1700000000000 + n * 1000, clientArrivalTime: 1700000000000 + n * 1000 + 5,
    deletionInfo: null, properties: { importance: 'normal', subject: '' },
  }, over);
}
function chain(convId, m) {
  return { conversationId: convId, replyChainId: m.id, messageMap: { [m.id]: m }, latestDeliveryTime: m.originalArrivalTime };
}

// Calendar, meeting catch-up and meeting recap databases (synthetic, Teams-shaped). Record shapes
// follow the real cache: dates are JS Dates, the catch-up duration is in milliseconds, and the
// optional flag keys (isAllDayEvent, isCancelled, isPrivate, isOrganizer, hasAttachments) are
// present on most records and absent on thin ones.
async function buildCalendar(acct, suffix, meetingConv) {
  const D = (d, h, mi) => new Date(Date.UTC(2023, 10, d, h, mi || 0));
  const hex = (t) => Array.from(t).map((c) => c.charCodeAt(0).toString(16).toUpperCase().padStart(2, '0')).join('');
  const pad = (n, w) => String(n).padStart(w, '0');
  // An Exchange-style global object id as lower-case hex, the way Teams' iCalUID has it (Outlook's
  // store holds the same id in upper case, and the Outlook mapper lower-cases it): 16-byte class id, then YYYY MM DD (zero
  // for a series id), then label bytes padded to 56 bytes (112 characters). The same encoding the
  // calendar core uses for per-occurrence ids.
  const gid = (label, date) => ('040000008200E00074C5B7101A82E008'
    + (date ? pad(date[0].toString(16).toUpperCase(), 4) + pad(date[1].toString(16).toUpperCase(), 2) + pad(date[2].toString(16).toUpperCase(), 2) : '00000000')
    + hex('FIXTURE-' + label).padEnd(72, '0')).toLowerCase();
  const dayOf = (d) => [2023, 11, d];
  const who = { name: 'Pat Example', address: 'pat@example.invalid' };
  const joinURL = (conv) => 'https://teams.example.invalid/l/meetup-join/' + encodeURIComponent(conv) + '/0?context=' + encodeURIComponent(JSON.stringify({ Tid: acct.tenant, Oid: acct.user }));
  const modified = D(14, 9);

  // Fields present on every real record.
  const base = (label, over) => Object.assign({
    objectId: 'FixtureEvent-' + acct.seed + '-' + label, lastModifiedTime: modified, isOnlineMeeting: false,
    myResponseType: 'Accepted', organizerName: who.name, organizerAddress: who.address, showAs: 'Busy',
    location: '', eventTimeZone: 'PacificSt',
  }, over);
  // Optional keys the real cache carries on most records; a thin record omits them.
  const std = (over) => Object.assign({
    eventType: 'Single', isAllDayEvent: false, isCancelled: false, isPrivate: false, isOrganizer: false,
    isAppointment: false, hasAttachments: false,
  }, over);
  const online = (conv) => ({
    isOnlineMeeting: true, skypeTeamsMeetingUrl: joinURL(conv),
    skypeTeamsDataObject: { cid: conv },
  });

  const richUID = gid('RICH-MEETING'); // the same in both accounts, to prove the account partition
  const seriesID = gid('STANDUP-' + acct.seed);
  const events = [];
  // (a) The rich single meeting: join URL, thread id of the account's Meeting conversation, dial-in,
  // six attendees (Organizer, Optional, a Resource room mailbox), two rooms in location, one
  // structured room with address and coordinates, body, one attachment. It states explicit false
  // for flags the thin events leave out.
  events.push(base('rich', std(Object.assign(online(meetingConv), {
    startTime: D(20, 17), endTime: D(20, 18), subject: 'Fixture planning review',
    iCalUID: richUID, cleanGlobalObjectId: richUID, utcOffset: '-08:00:00',
    isOrganizer: false, hasAttachments: true,
    schedulingServiceUpdateUrl: 'https://scheduling.example.invalid/update/rich',
    skypeTeamsData: JSON.stringify({ cid: meetingConv }),
    shortOnlineMeetingJoinUrl: 'https://teams.example.invalid/meet/fixture-rich',
    onlineMeetingConferenceId: '000000001', onlineMeetingTollNumber: '+1 555 0100',
    location: 'Fixture Room Alpha; Fixture Room Beta',
    meetingLocations: [{ displayName: 'Fixture Room Alpha', locationType: 'ConferenceRoom', address: { street: '1 Fixture Way', city: 'Fixtureville', state: 'ZZ', postalCode: '00000', countryOrRegion: 'Nowhere' }, coordinates: { latitude: 12.3456, longitude: 65.4321 } }],
    attendees: [
      { name: who.name, address: who.address, type: 'Organizer', role: 'Chair', status: { response: 'Organizer' } },
      { name: acct.name, address: 'me' + acct.seed + '@example.invalid', type: 'Required', role: 'Attendee', status: { response: 'Accepted' } },
      { name: 'Sam Example', address: 'sam@example.invalid', type: 'Optional', role: 'Attendee', status: { response: 'NotResponded' } },
      { name: 'Jordan Fixture', address: 'jordan@example.invalid', type: 'Required', role: 'Attendee', status: { response: 'TentativelyAccepted' } },
      { name: 'Casey Fixture', address: 'casey@example.invalid', type: 'Required', role: 'Attendee', status: { response: 'Declined' } },
      { name: 'Fixture Room Alpha', address: 'room-alpha@example.invalid', type: 'Resource', role: 'Attendee', status: { response: 'Accepted' } },
    ],
    bodyPreview: 'Fixture agenda: review the plan.',
    bodyContentType: 'HTML', bodyContent: '<html><body><p>Fixture agenda: <b>review the plan</b>.</p><p>Join: https://teams.example.invalid/meet/fixture-rich</p></body></html>',
    attachments: [{ id: 'fixture-attachment-' + acct.seed, name: 'Agenda.docx', fileName: 'Agenda.docx', size: 12345, contentType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', contentId: '', isInline: false, attachmentType: 'File' }],
    isReminderSet: true, reminderMinutesBeforeStart: 15, categories: ['Fixture category'],
  }))));
  // (b) Thin events: basic fields only. The first keeps hasAttachments, the second also omits it
  // and eventType, as 6 and 4 of the 148 real records do. Neither has the five optional flags.
  events.push(base('thin', { startTime: D(21, 15), endTime: D(21, 15, 30), subject: 'Fixture thin event', iCalUID: gid('THIN-' + acct.seed), cleanGlobalObjectId: gid('THIN-' + acct.seed), hasAttachments: true, eventType: 'Single' }));
  events.push(base('thin-bare', { startTime: D(21, 16), endTime: D(21, 16, 45), subject: 'Fixture thinnest event', eventTimeZone: 'Utc', iCalUID: gid('THINBARE-' + acct.seed), cleanGlobalObjectId: gid('THINBARE-' + acct.seed) }));
  // (c) A recurring series: the master (its id embeds no date), two occurrences and one exception
  // moved by an hour whose id still embeds its original date (the 24th).
  const series = (label, over) => base(label, std(Object.assign(online(meetingConv), { subject: 'Fixture standup', cleanGlobalObjectId: seriesID, isOrganizer: true, utcOffset: '-08:00:00' }, over)));
  events.push(series('standup-master', {
    eventType: 'RecurringMaster', iCalUID: seriesID, startTime: D(22, 18), endTime: D(22, 18, 30),
    recurrencePattern: 'Weekly', eventRecurrencePattern: { type: 'weekly', interval: 1, daysOfWeek: ['wednesday', 'thursday', 'friday'] },
    eventRecurrenceRange: { type: 'endDate', startDate: '2023-11-22', endDate: '2023-12-29' }, recurrenceEnd: D(29, 18),
  }));
  events.push(series('standup-occ-22', { eventType: 'Occurrence', iCalUID: gid('STANDUP-' + acct.seed, dayOf(22)), startTime: D(22, 18), endTime: D(22, 18, 30) }));
  events.push(series('standup-occ-23', { eventType: 'Occurrence', iCalUID: gid('STANDUP-' + acct.seed, dayOf(23)), startTime: D(23, 18), endTime: D(23, 18, 30) }));
  events.push(series('standup-exc-24', { eventType: 'Exception', iCalUID: gid('STANDUP-' + acct.seed, dayOf(24)), startTime: D(24, 19), endTime: D(24, 19, 30) }));
  // (d) Time zones: PacificSt (also above), CentralEuropeSt, and a name the seed table lacks.
  events.push(base('pacific', std({ startTime: D(21, 18), endTime: D(21, 19), subject: 'Fixture pacific sync', iCalUID: gid('PACIFIC-' + acct.seed), cleanGlobalObjectId: gid('PACIFIC-' + acct.seed), location: 'Fixture Room Gamma', isOrganizer: true })));
  events.push(base('cet', std({ startTime: D(23, 9), endTime: D(23, 10), eventTimeZone: 'CentralEuropeSt', subject: 'Fixture central europe sync', iCalUID: gid('CET-' + acct.seed), cleanGlobalObjectId: gid('CET-' + acct.seed), utcOffset: '01:00:00' })));
  events.push(base('unknown-zone', std({ startTime: D(24, 12), endTime: D(24, 13), eventTimeZone: 'FixtureUnknownSt', subject: 'Fixture unknown zone event', iCalUID: gid('UNKNOWNZONE-' + acct.seed), cleanGlobalObjectId: gid('UNKNOWNZONE-' + acct.seed) })));
  // (e) All-day: ASSUMED shape (no all-day event has been seen in a real cache). Start and end are
  // the instants of local midnight in the event's zone (PacificSt is UTC-8 in November).
  events.push(base('all-day', std({ isAllDayEvent: true, startTime: D(22, 8), endTime: D(23, 8), subject: 'Fixture holiday', showAs: 'Free', iCalUID: gid('ALLDAY-' + acct.seed), cleanGlobalObjectId: gid('ALLDAY-' + acct.seed) })));
  // (f) Cancelled and declined: ASSUMED shapes (neither has been seen in a real cache).
  events.push(base('cancelled', std({ isCancelled: true, startTime: D(27, 17), endTime: D(27, 18), subject: 'Canceled: Fixture offsite', showAs: 'Free', iCalUID: gid('CANCELLED-' + acct.seed), cleanGlobalObjectId: gid('CANCELLED-' + acct.seed) })));
  events.push(base('declined', std({ myResponseType: 'Declined', startTime: D(27, 19), endTime: D(27, 19, 30), subject: 'Fixture declined meeting', showAs: 'Free', iCalUID: gid('DECLINED-' + acct.seed), cleanGlobalObjectId: gid('DECLINED-' + acct.seed) })));
  // (g) A private event.
  events.push(base('private', std({ isPrivate: true, isOrganizer: true, startTime: D(28, 20), endTime: D(28, 21), subject: 'Fixture private appointment', myResponseType: 'Organizer', iCalUID: gid('PRIVATE-' + acct.seed), cleanGlobalObjectId: gid('PRIVATE-' + acct.seed) })));

  const cal = await open('Teams:calendar:react-web-client:' + suffix, [['calendar', 'objectId'], ['calendar-internal-data', 'key']]);
  const ctx = cal.transaction(['calendar', 'calendar-internal-data'], 'readwrite');
  for (const e of events) ctx.objectStore('calendar').put(e);
  const internal = ctx.objectStore('calendar-internal-data');
  internal.put({ key: 'syncState', state: 'idle', pageCount: 3, lastRange: { from: D(13, 0), to: D(30, 0) } });
  internal.put({ key: 'calendarSettings', id: 'calendarSettings', enableM365Calendar: true, currentCalendarForceEnableVersion: 3, lastUpdateM365CalendarTimestamp: D(14, 8) });
  internal.put({ key: 'lastSuccesfulSyncTimestamp', value: D(14, 9, 30) });
  await done(ctx);
  cal.close();

  // Meeting catch-up (store 1), keyed by iCalUid. Durations are milliseconds.
  const call = (id, over) => Object.assign({
    callId: id, isMissed: false, url: 'https://fixture.sharepoint.example/recordings/' + id, duration: 600000,
    recordingStartTime: D(20, 17, 1), speakers: [{ id: '00000000-0000-4000-8000-0000000000ee', displayName: 'Pat Example' }],
    mentions: [], tasks: [], headline: null, outline: null,
  }, over);
  const catchUp = (uid, end, data) => ({ iCalUid: uid, meetingEndTime: end, expiration: new Date(end.getTime() + 30 * 86400000), data });
  const richCall = 'fixture-call-' + acct.seed + '-rich-1';
  const cdb = await open('Teams:meetforwork-manager:react-web-client:' + suffix, [['meetforwork-meeting-catch-up', 'iCalUid']]);
  const cutx = cdb.transaction('meetforwork-meeting-catch-up', 'readwrite');
  const cu = cutx.objectStore('meetforwork-meeting-catch-up');
  // The rich event: two calls, the first with tasks and mentions.
  cu.put(catchUp(richUID, D(20, 18), [
    call(richCall, {
      duration: 3300000, recordingStartTime: D(20, 17, 2),
      speakers: [{ id: '00000000-0000-4000-8000-0000000000ee', displayName: 'Pat Example' }, { id: '00000000-0000-4000-8000-0000000000dd', displayName: 'Sam Example' }],
      mentions: [{ speaker: 'Pat Example', time: '00:12:05', absoluteTime: D(20, 17, 14), text: 'Fixture mention of ' + acct.name, highlights: ['Fixture mention'] }],
      tasks: [
        { headline: 'Send the fixture plan', text: 'Pat Example will send the fixture plan.', ownerDisplayName: 'Pat Example', speaker: 'Pat Example', time: D(20, 17, 20) },
        { headline: 'Book Fixture Room Beta', text: acct.name + ' will book the room.', ownerDisplayName: acct.name, speaker: 'Sam Example', time: D(20, 17, 40) },
      ],
    }),
    call('fixture-call-' + acct.seed + '-rich-2', { duration: 420000, recordingStartTime: D(20, 17, 50) }),
  ]));
  // One call, no tasks, for the first standup occurrence.
  cu.put(catchUp(gid('STANDUP-' + acct.seed, dayOf(22)), D(22, 18, 30), [call('fixture-call-' + acct.seed + '-standup-22', { duration: 1500000, recordingStartTime: D(22, 18, 2) })]));
  // Placeholders: the event was checked and had no recap (empty data). One matches an event, one none.
  cu.put(catchUp(gid('THIN-' + acct.seed), D(21, 15, 30), []));
  cu.put(catchUp(gid('NOEVENT-EMPTY-' + acct.seed), D(21, 10), []));
  // A record whose iCalUid matches no event but whose data has content.
  cu.put(catchUp(gid('NOEVENT-CONTENT-' + acct.seed), D(15, 12), [call('fixture-call-' + acct.seed + '-orphan', { duration: 900000, recordingStartTime: D(15, 11, 50), tasks: [{ headline: 'Orphan task', text: 'A task on a meeting with no event.', ownerDisplayName: 'Sam Example', speaker: 'Sam Example', time: D(15, 11, 55) }] })]));
  await done(cutx);
  cdb.close();

  // Meeting recaps (store 2), keyed by a 186-character recapId.
  const recapId = (label) => ('FixtureRecapId-' + acct.seed + '-' + label + '-').padEnd(186, 'x');
  const rdb2 = await open('Teams:meeting-recap-manager:react-web-client:' + suffix, [['meeting-recap-catchup', 'recapId']]);
  const rtx = rdb2.transaction('meeting-recap-catchup', 'readwrite');
  const rs = rtx.objectStore('meeting-recap-catchup');
  // Joined to the catch-up item by callId: action items, a mention event, speakers, topics.
  // The real record is {data, recapId, syncTimeUtc}: the content sits under data (measured on a real cache).
  const wrapRecap = (id, data) => ({ recapId: id, syncTimeUtc: D(24, 8), data: Object.assign({ callId: null, error: null, isPremium: true, traceId: 'fixture-trace-' + acct.seed, organizerTenantId: acct.tenant }, data) });
  rs.put(wrapRecap(recapId('joined'), {
    callId: richCall, organizerId: '00000000-0000-4000-8000-0000000000ee',
    shortSummary: 'Fixture summary: the plan was reviewed.', adaptiveRecap: '',
    meetingSummary: [{ title: 'Fixture decisions', text: 'The plan was approved.' }],
    actionItems: [
      { actionItemTitle: 'Send the fixture plan', displayCleanContent: 'Pat Example will send the fixture plan by Friday.', ownerName: 'Pat Example', speakerName: 'Pat Example' },
      { actionItemTitle: 'Book Fixture Room Beta', displayCleanContent: acct.name + ' will book the room.', ownerName: acct.name, speakerName: 'Sam Example' },
    ],
    atMentionEvents: [{ utteranceContainingTheMention: 'Fixture utterance mentioning ' + acct.name, mentionedByUserDisplayName: 'Pat Example', dateTimeUtc: D(20, 17, 14) }],
    speakersSegmentations: [{ speakerName: 'Pat Example', segments: [{ startOffset: '00:00:05', endOffset: '00:10:00' }] }, { speakerName: 'Sam Example', segments: [{ startOffset: '00:10:00', endOffset: '00:20:00' }] }],
    topicSegmentations: [{ topic: 'Fixture plan', startOffset: '00:00:00', endOffset: '00:30:00' }],
    meetingStartTime: D(20, 17), meetingEndTime: D(20, 18), recordingStartTime: D(20, 17, 2), recordingEndTime: D(20, 17, 57),
    attendeesCount: 6, userAttendanceStatus: 'Attended', hasConfRoomConnected: false,
  }));
  // Only here (no catch-up partner): its meeting times equal exactly one event (the Central Europe
  // sync), so it links by time.
  rs.put(wrapRecap(recapId('time-only'), {
    callId: 'fixture-call-' + acct.seed + '-cet', organizerId: '00000000-0000-4000-8000-0000000000dd',
    shortSummary: 'Fixture summary of a meeting that only the recap store holds.',
    meetingSummary: [{ title: 'Fixture notes', text: 'Nothing was decided.' }],
    actionItems: [{ actionItemTitle: 'Follow up', displayCleanContent: 'Sam Example will follow up.', ownerName: 'Sam Example', speakerName: 'Sam Example' }],
    atMentionEvents: [],
    speakersSegmentations: [{ speakerName: 'Sam Example', segments: [{ startOffset: '00:00:00', endOffset: '00:25:00' }] }],
    topicSegmentations: [],
    meetingStartTime: D(23, 9), meetingEndTime: D(23, 10), recordingStartTime: D(23, 9, 1), recordingEndTime: D(23, 9, 26),
    attendeesCount: 3, userAttendanceStatus: 'Attended',
  }));
  await done(rtx);
  rdb2.close();
}

window.buildAccount = async function (acct) {
  const suffix = acct.tenant + ':' + acct.user + ':en-us';
  const r = rng(acct.seed);
  const convs = {
    chat: '19:' + acct.user + '_00000000-0000-4000-8000-0000000000ff@unq.gbl.spaces',
    topic: '19:topicchannel' + acct.seed + '@thread.tacv2',
    space: '19:space' + acct.seed + '@thread.v2',
    meeting: '19:meeting_FIXTURE' + acct.seed + '@thread.v2',
    channel2: '19:planningchannel' + acct.seed + '@thread.tacv2',
    group: '19:untitledgroup' + acct.seed + '@thread.v2',
  };
  const other = '8:orgid:00000000-0000-4000-8000-0000000000ee';
  const me = '8:orgid:' + acct.user;
  const ts = (n) => 1700000000000 + n * 1000;
  // Same conversation id in both accounts.
  const shared = '19:shared-fixture-conversation@thread.v2';

  const rdb = await open('Teams:replychain-manager:react-web-client:' + suffix, [['replychains-2', 'replyChainId']]);
  let n = 0;
  const put = async (chains, del) => {
    const tx = rdb.transaction('replychains-2', 'readwrite');
    const st = tx.objectStore('replychains-2');
    for (const c of chains) st.put(c);
    for (const k of del || []) st.delete(k);
    await done(tx);
  };
  const c1 = [];
  const add = (conv, over) => { const m = msg(acct, conv, ++n, over); c1.push(chain(conv, m)); return m; };
  add(convs.chat, { content: '<p>Hello from ' + acct.name + '</p>' });
  add(convs.chat, { content: '<p>Fish &amp; chips &lt;3 &quot;quoted&quot; &#39;single&#39; &nbsp;done</p>' });
  add(convs.chat, { content: '<p>Party \u{1F389}\u{1F680} \u{1F468}‍\u{1F469}‍\u{1F467}</p>' });
  add(convs.chat, { content: '<p>\u{1F44D}</p>' });
  add(convs.chat, { content: '<p dir="rtl">مرحبا بالعالم שלום</p>' });
  add(convs.chat, { content: '<p><span itemscope itemtype="http://schema.skype.com/Mention" itemid="0">Pat Example</span> please review</p>', properties: { mentions: [{ id: 0, mentionType: 'person', mri: '8:orgid:' + acct.user, displayName: 'Pat Example' }] } });
  add(convs.chat, { content: '<p><img src="https://teams.microsoft.com/api/v1/objects/0-fixture/views/imgo" itemtype="http://schema.skype.com/AMSImage" alt="image"></p>' });
  add(convs.chat, { contentType: 'Text', messageType: 'RichText/Html', content: '<attachment id="card-1"></attachment>', properties: { cards: '[{"contentType":"application/vnd.microsoft.card.adaptive","content":{"type":"AdaptiveCard","body":[{"type":"TextBlock","text":"Adaptive fixture card"}]}}]' } });
  add(convs.chat, { messageType: 'ThreadActivity/AddMember', content: '<addmember><eventtime>1700000100000</eventtime><initiator>8:orgid:' + acct.user + '</initiator><target>8:orgid:00000000-0000-4000-8000-0000000000ee</target></addmember>' });
  add(convs.chat, { messageType: 'Event/Call', content: '<ended/><partlist type="ended" alt=""><part identity="' + acct.user + '"><name>' + acct.name + '</name></part></partlist>' });
  const edited = add(convs.space, { content: '<p>Original text</p>' });
  const deleted = add(convs.space, { content: '<p>Will be deleted</p>', deletionInfo: { deleteTime: 1700000500000, deletedBy: '8:orgid:' + acct.user } });
  for (let i = 0; i < 26; i++) {
    const conv = [convs.chat, convs.topic, convs.space, convs.meeting, shared][i % 5];
    add(conv, { content: '<p>Filler ' + i + ' ' + Math.floor(r() * 1e6).toString(36) + '</p>' });
  }
  await put(c1);

  // Agent-oriented enrichment. Messages from the other person (Pat Example) are candidates for unread.
  const pat = { creator: other, imDisplayName: 'Pat Example' };
  const c2 = [];
  const add2 = (conv, over) => { const m = msg(acct, conv, ++n, Object.assign({}, pat, over)); c2.push(chain(conv, m)); return m; };
  const props = (p) => Object.assign({ importance: 'normal', subject: '' }, p);
  const mentionOther = add2(convs.chat, {
    content: '<p><span itemscope itemtype="http://schema.skype.com/Mention" itemid="0">Alex Fixture</span> and <at id="1">Sam Tag</at> see this</p>',
    properties: props({ mentions: JSON.stringify([{ '@type': 'http://schema.skype.com/Mention', itemid: 0, mentionType: 'person', mri: me, displayName: acct.name }, { itemid: 1, mentionType: 'tag', mri: 'tag:fixture-tag', displayName: 'Sam Tag' }]) }),
  });
  const mentionNotMe = add2(convs.chat, {
    content: '<p><span itemscope itemtype="http://schema.skype.com/Mention" itemid="0">Sam Example</span> is not you</p>',
    properties: props({ mentions: JSON.stringify([{ itemid: 0, mentionType: 'person', mri: '8:orgid:00000000-0000-4000-8000-0000000000dd', displayName: 'Sam Example' }]) }),
  });
  const reacted = add2(convs.chat, {
    content: '<p>Reactions here</p>',
    properties: props({ emotions: [
      { key: 'like', users: [{ mri: me, time: ts(n) + 10, value: String(ts(n) + 10) }, { mri: other, time: ts(n) + 20, value: String(ts(n) + 20) }] },
      { key: 'heart', users: [{ mri: me, time: ts(n) + 30, value: String(ts(n) + 30) }] },
    ] }),
  });
  add2(convs.chat, {
    content: '<p>Files attached</p>',
    properties: props({ files: JSON.stringify([
      { '@type': 'http://schema.skype.com/File', id: 'f1', itemid: 'f1', fileName: 'Quarterly report.docx', fileType: 'docx', objectUrl: 'https://fixture.sharepoint.example/teams/fixture/Quarterly%20report.docx', fileInfo: { fileUrl: 'https://fixture.sharepoint.example/teams/fixture/Quarterly%20report.docx', shareUrl: null } },
      { itemid: 'f2', fileName: 'diagram.png', fileType: 'png', objectUrl: null, fileInfo: { fileUrl: 'https://fixture.sharepoint.example/teams/fixture/diagram.png', shareUrl: 'https://fixture.sharepoint.example/s/diagram' } },
    ]) }),
  });
  add2(convs.chat, {
    content: '<p>Read <a href="https://example.com/docs?a=1&amp;b=2">the docs</a> and https://example.org/plain</p>',
    properties: props({ links: JSON.stringify([{ '@type': 'http://schema.skype.com/HyperLink', itemid: 'l1', url: 'https://example.com/docs?a=1&b=2', previewenabled: true, preview: {} }, { itemid: 'l2', url: 'https://example.org/plain' }]) }),
  });
  add2(convs.chat, { content: '<p>Zero-width horizon newer message</p>' });
  const root = add2(convs.topic, {
    content: '<p>Channel post with a subject</p>',
    properties: props({ subject: 'Fixture subject', importance: 'high', pinned: JSON.stringify({ creatorId: me, pinnedTime: ts(n) + 400000 }) }),
  });
  const reply = msg(acct, convs.topic, ++n, Object.assign({}, pat, { parentMessageId: root.id, content: '<blockquote itemscope itemtype="http://schema.skype.com/Reply"><p>Channel post with a subject</p></blockquote><p>Reply in thread</p>', properties: props({}) }));
  c2.push({ conversationId: convs.topic, replyChainId: root.id, messageMap: { [root.id]: root, [reply.id]: reply }, latestDeliveryTime: reply.originalArrivalTime });
  const poll = add2(convs.channel2, { content: '<p>Planning channel message</p>' });
  add2(convs.group, { content: '<p>Group chat message</p>' });
  await put(c2);

  // Highly compressible chains (snappy).
  const comp = [];
  for (const reps of [400, 1500, 3000, 6000]) comp.push(chain(convs.topic, msg(acct, convs.topic, ++n, { content: '<p>' + 'compressible fixture text. '.repeat(reps) + '</p>' })));
  await put(comp);

  // Incompressible large chain, only in the first account, forces blob spill.
  if (acct.big) {
    let s = '';
    const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    for (let i = 0; i < 1100 * 1024; i++) s += chars[Math.floor(r() * chars.length)];
    await put([chain(convs.topic, msg(acct, convs.topic, ++n, { content: '<p>' + s + '</p>' }))]);
  } else {
    let s = '';
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    for (let i = 0; i < 200 * 1024; i++) s += chars[Math.floor(r() * chars.length)];
    await put([chain(convs.topic, msg(acct, convs.topic, ++n, { content: '<p>' + s + '</p>' }))]);
  }

  // Edit (higher version), delete a record, overwrite another.
  const editedChain = chain(convs.space, Object.assign({}, edited, { content: '<p>Edited text</p>', version: edited.version + 60000, properties: { edittime: String(edited.version + 60000) } }));
  const gone = c1[20];
  await put([editedChain], [gone.replyChainId]);
  const over = c1[1];
  await put([chain(over.conversationId, Object.assign({}, over.messageMap[over.replyChainId], { content: '<p>Overwritten twice</p>', version: 1700000999000 }))]);
  // Broadcast mentions of the account (no person mention of it): a team, a tag and @everyone. The
  // activity feed below says why each reached the account. They sit in the untitled group chat,
  // which has no read marker, so they never count as unread.
  const c3 = [];
  const broadcast = {};
  for (const [kind, mri, name] of [['team', convs.space, 'Fixture team ' + acct.seed], ['tag', 'tag:fixture-tag-2', 'Fixture Tag Two'], ['everyone', 'everyone', 'everyone']]) {
    const m = msg(acct, convs.group, ++n, Object.assign({}, pat, { content: '<p><span itemscope itemtype="http://schema.skype.com/Mention" itemid="0">' + name + '</span> broadcast ' + kind + '</p>', properties: props({ mentions: JSON.stringify([{ itemid: 0, mentionType: kind, mri, displayName: name }]) }) }));
    c3.push(chain(convs.group, m));
    broadcast[kind] = m;
  }
  await put(c3);

  // Meeting conversation: call recordings, a transcript and a call event for the calendar series.
  // Their sent times fall just after the two standup occurrences below; one recording matches no
  // occurrence. They are the account's own messages, so they add nothing to the unread counts.
  const c4 = [];
  const meetMsg = (type, at, content) => {
    const m = msg(acct, convs.meeting, ++n, { messageType: type, content, originalArrivalTime: at, clientArrivalTime: at + 5 });
    c4.push(chain(convs.meeting, m));
    return m;
  };
  const recording = (k) => '<URIObject type="Video.1/Message.1" uri="https://fixture.sharepoint.example/recordings/standup-' + k + '"><Title>Fixture standup recording ' + k + '</Title><a href="https://fixture.sharepoint.example/recordings/standup-' + k + '">Recording ' + k + '</a></URIObject>';
  meetMsg('Event/Call', Date.UTC(2023, 10, 22, 18, 0, 30), '<ended/><partlist type="ended" alt=""><part identity="' + acct.user + '"><name>' + acct.name + '</name></part></partlist>');
  meetMsg('RichText/Media_CallRecording', Date.UTC(2023, 10, 22, 18, 31), recording(1));
  meetMsg('RichText/Media_CallTranscript', Date.UTC(2023, 10, 22, 18, 32), '<URIObject type="Video.1/Message.1" uri="https://fixture.sharepoint.example/transcripts/standup-1"><Title>Fixture standup transcript</Title></URIObject>');
  meetMsg('RichText/Media_CallRecording', Date.UTC(2023, 10, 23, 18, 31), recording(2));
  meetMsg('RichText/Media_CallRecording', Date.UTC(2023, 11, 5, 18, 31), recording(3));
  await put(c4);
  rdb.close();

  const cdb = await open('Teams:conversation-manager:react-web-client:' + suffix, [['conversations', 'id']]);
  const tx = cdb.transaction('conversations', 'readwrite');
  const st = tx.objectStore('conversations');
  const mk = (id, type, title, tp, extra) => Object.assign({
    id, type, chatTitle: { shortTitle: title, longTitle: title + ' (long)' }, threadProperties: Object.assign({ topic: title, threadType: type.toLowerCase() }, tp || {}),
    members: [{ id: me, role: 'Admin' }, { id: other, role: 'User' }],
    lastMessageTimeUtc: 1700000100000, parentId: null, teamId: '',
    properties: { consumptionhorizon: '', favorite: 'false' },
  }, extra);
  const horizon = (n0) => ts(n0) + ';' + (ts(n0) + 5000) + ';' + ts(n0);
  // The chat's horizon sits after message 4, so its later messages are newer than the read marker.
  st.put(mk(convs.chat, 'Chat', 'Fixture chat ' + acct.seed, { threadType: 'chat' }, { properties: { consumptionhorizon: horizon(4), favorite: 'true' } }));
  // A channel: its DisplayName is the channel topic; the team's record (below) supplies the team name.
  st.put(mk(convs.topic, 'Topic', 'General', { threadType: 'topic' }, { chatTitle: undefined, threadProperties: { topicThreadTopic: 'General', threadType: 'topic' }, parentId: convs.space, teamId: convs.space, properties: { consumptionhorizon: horizon(30), favorite: 'false' } }));
  st.put(mk(convs.channel2, 'Topic', 'Planning', { threadType: 'topic' }, { chatTitle: undefined, threadProperties: { topic: 'Planning', threadType: 'topic' }, parentId: convs.space, teamId: convs.space, properties: { consumptionhorizon: '0;0;0' } }));
  st.put(mk(convs.space, 'Space', 'Fixture team ' + acct.seed, { threadType: 'space' }, { chatTitle: undefined, threadProperties: { spaceThreadTopic: 'Fixture team ' + acct.seed, threadType: 'space' }, teamId: convs.space, members: [], properties: {} }));
  st.put(mk(convs.meeting, 'Meeting', 'Fixture standup', { threadType: 'meeting' }, { properties: { consumptionhorizon: horizon(2) } }));
  st.put(mk(shared, 'Chat', 'Shared conversation id', { threadType: 'chat' }));
  // A group chat with no title at all: its name comes from the members.
  st.put(mk(convs.group, 'Chat', '', { threadType: 'chat' }, { chatTitle: null, threadProperties: { topic: null, threadType: 'chat' }, members: [{ id: me, role: 'Admin', friendlyName: acct.name }, { id: other, role: 'User', friendlyName: 'Pat Example' }, { id: '8:orgid:00000000-0000-4000-8000-0000000000dd', role: 'User', friendlyName: 'Sam Example' }] }));
  await done(tx);
  cdb.close();


  // Activity feed: one mention, reply and reaction each, read and unread, plus a non-message item.
  const adbf = await open('Teams:activity-manager:react-web-client:' + suffix, [['feed-items', 'activityId']]);
  const ftx = adbf.transaction('feed-items', 'readwrite');
  const fst = ftx.objectStore('feed-items');
  const feed = (i, type, subtype, isRead, src, extra) => fst.put(Object.assign({
    activityId: 'fixture-activity-' + acct.seed + '-' + i, activityType: type, activitySubtype: subtype, activityVersion: '1.0', isRead,
    timestamp: ts(40) + i * 60000, sourceThreadId: src.conversationId, sourceMessageId: src.id, sourceReplyChainId: src.parentMessageId, messageId: src.id,
  }, extra || {}));
  feed(1, 'mentionInChat', 'person', false, mentionOther);
  feed(2, 'mention', 'channel', true, root);
  feed(3, 'reply', 'channel', false, reply);
  feed(4, 'reactionInChat', 'like', false, reacted);
  feed(5, 'reaction', 'heart', true, root);
  feed(6, 'msGraph', 'approvalCompleted', false, { conversationId: '', id: 'graph-message-' + acct.seed, parentMessageId: '' }, { teamsAppId: 'fixture-app-id' });
  feed(7, 'replyToReply', 'channel', true, reply);
  feed(8, 'follow', '', false, poll);
  feed(9, 'mention', 'team', false, broadcast.team);
  feed(10, 'mention', 'tag', true, broadcast.tag);
  feed(11, 'mentionInChat', 'everyone', false, broadcast.everyone);
  await done(ftx);
  adbf.close();

  // Extra managers that are neither typed nor credential-like: read generically, with date, binary
  // and array keys. The first account's calendar-manager also holds a store named like a credential,
  // which must be skipped.
  const kdb = await open('Teams:calendar-manager:react-web-client:' + suffix, [['events', 'id']].concat(acct.big ? [['sessionTokens', 'id']] : []));
  const ktx = kdb.transaction(acct.big ? ['events', 'sessionTokens'] : ['events'], 'readwrite');
  ktx.objectStore('events').put({ id: 'fixture-event-' + acct.seed + '-1', subject: 'Fixture planning', start: new Date(1700000000000), allDay: false });
  ktx.objectStore('events').put({ id: 'fixture-event-' + acct.seed + '-2', subject: 'Fixture holiday', start: new Date(1700006400000), allDay: true });
  if (acct.big) ktx.objectStore('sessionTokens').put({ id: 'decoy', value: 'FIXTURE-SESSION-DECOY' });
  await done(ktx);
  kdb.close();
  const pdb = await open('Teams:pinned-manager:react-web-client:' + suffix, [['pins', 'pinKey']]);
  const ptx = pdb.transaction('pins', 'readwrite');
  ptx.objectStore('pins').put({ pinKey: 'fixture-pin-' + acct.seed, label: 'Fixture pin' });
  ptx.objectStore('pins').put({ pinKey: new Date(1700000000000 + acct.seed * 1000), label: 'Date-keyed pin' });
  ptx.objectStore('pins').put({ pinKey: new Uint8Array([1, 2, 3, acct.seed]), label: 'Binary-keyed pin' });
  ptx.objectStore('pins').put({ pinKey: ['fixture', acct.seed, 'array'], label: 'Array-keyed pin' });
  await done(ptx);
  pdb.close();

  await buildCalendar(acct, suffix, convs.meeting);

  // Decoy credential databases that must never be decoded. The first account only, so the fixture
  // holds three of them: Teams:auth, a token cache under another manager, and a bare keyval store.
  if (acct.big) {
    const adb = await open('Teams:auth:react-web-client:' + suffix, [['tokens', 'id']]);
    const atx = adb.transaction('tokens', 'readwrite');
    atx.objectStore('tokens').put({ id: 'decoy', secret: 'FIXTURE-SECRET-TOKEN' });
    await done(atx);
    adb.close();
    const tdb = await open('Teams:token-cache-manager:react-web-client:' + suffix, [['entries', 'id']]);
    const ttx = tdb.transaction('entries', 'readwrite');
    ttx.objectStore('entries').put({ id: 'decoy', access_token: 'FIXTURE-ACCESS-DECOY' });
    await done(ttx);
    tdb.close();
    const vdb = await open('keyval-store', [['keyval', 'id']]);
    const vtx = vdb.transaction('keyval', 'readwrite');
    vtx.objectStore('keyval').put({ id: 'decoy', value: 'FIXTURE-KEYVAL-DECOY' });
    await done(vtx);
    vdb.close();
  }
  return { chains: n };
};
</script>
