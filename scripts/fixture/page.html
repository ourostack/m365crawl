<!doctype html>
<meta charset="utf-8">
<title>teamscrawl fixture</title>
<script>
// Synthetic data only. Builds one account's Teams-shaped IndexedDB databases.
const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const done = (tx) => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
const open = (name, stores) => new Promise((res, rej) => {
  const r = indexedDB.open(name, 1);
  r.onupgradeneeded = () => { for (const [s, kp] of stores) r.result.createObjectStore(s, { keyPath: kp }); };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});

// Deterministic PRNG so regeneration is stable apart from browser-side timestamps.
function rng(seed) { let s = seed >>> 0; return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296); }

function msg(acct, convId, n, over) {
  const id = String(1700000000000 + n * 1000);
  return Object.assign({
    id, conversationId: convId, parentMessageId: id, clientMessageId: String(9000000000 + n),
    version: 1700000000000 + n * 1000, sequenceId: n, messageType: 'RichText/Html', contentType: 'Text',
    content: '<p>Fixture message ' + n + '</p>', imDisplayName: acct.name, creator: '8:orgid:' + acct.user,
    originalArrivalTime: 1700000000000 + n * 1000, clientArrivalTime: 1700000000000 + n * 1000 + 5,
    deletionInfo: null, properties: { importance: 'normal', subject: '' },
  }, over);
}
function chain(convId, m) {
  return { conversationId: convId, replyChainId: m.id, messageMap: { [m.id]: m }, latestDeliveryTime: m.originalArrivalTime };
}

window.buildAccount = async function (acct) {
  const suffix = acct.tenant + ':' + acct.user + ':en-us';
  const r = rng(acct.seed);
  const convs = {
    chat: '19:' + acct.user + '_00000000-0000-4000-8000-0000000000ff@unq.gbl.spaces',
    topic: '19:topicchannel' + acct.seed + '@thread.tacv2',
    space: '19:space' + acct.seed + '@thread.v2',
    meeting: '19:meeting_FIXTURE' + acct.seed + '@thread.v2',
    channel2: '19:planningchannel' + acct.seed + '@thread.tacv2',
    group: '19:untitledgroup' + acct.seed + '@thread.v2',
  };
  const other = '8:orgid:00000000-0000-4000-8000-0000000000ee';
  const me = '8:orgid:' + acct.user;
  const ts = (n) => 1700000000000 + n * 1000;
  // Same conversation id in both accounts.
  const shared = '19:shared-fixture-conversation@thread.v2';

  const rdb = await open('Teams:replychain-manager:react-web-client:' + suffix, [['replychains-2', 'replyChainId']]);
  let n = 0;
  const put = async (chains, del) => {
    const tx = rdb.transaction('replychains-2', 'readwrite');
    const st = tx.objectStore('replychains-2');
    for (const c of chains) st.put(c);
    for (const k of del || []) st.delete(k);
    await done(tx);
  };
  const c1 = [];
  const add = (conv, over) => { const m = msg(acct, conv, ++n, over); c1.push(chain(conv, m)); return m; };
  add(convs.chat, { content: '<p>Hello from ' + acct.name + '</p>' });
  add(convs.chat, { content: '<p>Fish &amp; chips &lt;3 &quot;quoted&quot; &#39;single&#39; &nbsp;done</p>' });
  add(convs.chat, { content: '<p>Party \u{1F389}\u{1F680} \u{1F468}‍\u{1F469}‍\u{1F467}</p>' });
  add(convs.chat, { content: '<p>\u{1F44D}</p>' });
  add(convs.chat, { content: '<p dir="rtl">مرحبا بالعالم שלום</p>' });
  add(convs.chat, { content: '<p><span itemscope itemtype="http://schema.skype.com/Mention" itemid="0">Pat Example</span> please review</p>', properties: { mentions: [{ id: 0, mentionType: 'person', mri: '8:orgid:' + acct.user, displayName: 'Pat Example' }] } });
  add(convs.chat, { content: '<p><img src="https://teams.microsoft.com/api/v1/objects/0-fixture/views/imgo" itemtype="http://schema.skype.com/AMSImage" alt="image"></p>' });
  add(convs.chat, { contentType: 'Text', messageType: 'RichText/Html', content: '<attachment id="card-1"></attachment>', properties: { cards: '[{"contentType":"application/vnd.microsoft.card.adaptive","content":{"type":"AdaptiveCard","body":[{"type":"TextBlock","text":"Adaptive fixture card"}]}}]' } });
  add(convs.chat, { messageType: 'ThreadActivity/AddMember', content: '<addmember><eventtime>1700000100000</eventtime><initiator>8:orgid:' + acct.user + '</initiator><target>8:orgid:00000000-0000-4000-8000-0000000000ee</target></addmember>' });
  add(convs.chat, { messageType: 'Event/Call', content: '<ended/><partlist type="ended" alt=""><part identity="' + acct.user + '"><name>' + acct.name + '</name></part></partlist>' });
  const edited = add(convs.space, { content: '<p>Original text</p>' });
  const deleted = add(convs.space, { content: '<p>Will be deleted</p>', deletionInfo: { deleteTime: 1700000500000, deletedBy: '8:orgid:' + acct.user } });
  for (let i = 0; i < 26; i++) {
    const conv = [convs.chat, convs.topic, convs.space, convs.meeting, shared][i % 5];
    add(conv, { content: '<p>Filler ' + i + ' ' + Math.floor(r() * 1e6).toString(36) + '</p>' });
  }
  await put(c1);

  // Agent-oriented enrichment. Messages from the other person (Pat Example) are candidates for unread.
  const pat = { creator: other, imDisplayName: 'Pat Example' };
  const c2 = [];
  const add2 = (conv, over) => { const m = msg(acct, conv, ++n, Object.assign({}, pat, over)); c2.push(chain(conv, m)); return m; };
  const props = (p) => Object.assign({ importance: 'normal', subject: '' }, p);
  const mentionOther = add2(convs.chat, {
    content: '<p><span itemscope itemtype="http://schema.skype.com/Mention" itemid="0">Alex Fixture</span> and <at id="1">Sam Tag</at> see this</p>',
    properties: props({ mentions: JSON.stringify([{ '@type': 'http://schema.skype.com/Mention', itemid: 0, mentionType: 'person', mri: me, displayName: acct.name }, { itemid: 1, mentionType: 'tag', mri: 'tag:fixture-tag', displayName: 'Sam Tag' }]) }),
  });
  const mentionNotMe = add2(convs.chat, {
    content: '<p><span itemscope itemtype="http://schema.skype.com/Mention" itemid="0">Sam Example</span> is not you</p>',
    properties: props({ mentions: JSON.stringify([{ itemid: 0, mentionType: 'person', mri: '8:orgid:00000000-0000-4000-8000-0000000000dd', displayName: 'Sam Example' }]) }),
  });
  const reacted = add2(convs.chat, {
    content: '<p>Reactions here</p>',
    properties: props({ emotions: [
      { key: 'like', users: [{ mri: me, time: ts(n) + 10, value: String(ts(n) + 10) }, { mri: other, time: ts(n) + 20, value: String(ts(n) + 20) }] },
      { key: 'heart', users: [{ mri: me, time: ts(n) + 30, value: String(ts(n) + 30) }] },
    ] }),
  });
  add2(convs.chat, {
    content: '<p>Files attached</p>',
    properties: props({ files: JSON.stringify([
      { '@type': 'http://schema.skype.com/File', id: 'f1', itemid: 'f1', fileName: 'Quarterly report.docx', fileType: 'docx', objectUrl: 'https://fixture.sharepoint.example/teams/fixture/Quarterly%20report.docx', fileInfo: { fileUrl: 'https://fixture.sharepoint.example/teams/fixture/Quarterly%20report.docx', shareUrl: null } },
      { itemid: 'f2', fileName: 'diagram.png', fileType: 'png', objectUrl: null, fileInfo: { fileUrl: 'https://fixture.sharepoint.example/teams/fixture/diagram.png', shareUrl: 'https://fixture.sharepoint.example/s/diagram' } },
    ]) }),
  });
  add2(convs.chat, {
    content: '<p>Read <a href="https://example.com/docs?a=1&amp;b=2">the docs</a> and https://example.org/plain</p>',
    properties: props({ links: JSON.stringify([{ '@type': 'http://schema.skype.com/HyperLink', itemid: 'l1', url: 'https://example.com/docs?a=1&b=2', previewenabled: true, preview: {} }, { itemid: 'l2', url: 'https://example.org/plain' }]) }),
  });
  add2(convs.chat, { content: '<p>Zero-width horizon newer message</p>' });
  const root = add2(convs.topic, {
    content: '<p>Channel post with a subject</p>',
    properties: props({ subject: 'Fixture subject', importance: 'high', pinned: JSON.stringify({ creatorId: me, pinnedTime: ts(n) + 400000 }) }),
  });
  const reply = msg(acct, convs.topic, ++n, Object.assign({}, pat, { parentMessageId: root.id, content: '<blockquote itemscope itemtype="http://schema.skype.com/Reply"><p>Channel post with a subject</p></blockquote><p>Reply in thread</p>', properties: props({}) }));
  c2.push({ conversationId: convs.topic, replyChainId: root.id, messageMap: { [root.id]: root, [reply.id]: reply }, latestDeliveryTime: reply.originalArrivalTime });
  const poll = add2(convs.channel2, { content: '<p>Planning channel message</p>' });
  add2(convs.group, { content: '<p>Group chat message</p>' });
  await put(c2);

  // Highly compressible chains (snappy).
  const comp = [];
  for (const reps of [400, 1500, 3000, 6000]) comp.push(chain(convs.topic, msg(acct, convs.topic, ++n, { content: '<p>' + 'compressible fixture text. '.repeat(reps) + '</p>' })));
  await put(comp);

  // Incompressible large chain, only in the first account, forces blob spill.
  if (acct.big) {
    let s = '';
    const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    for (let i = 0; i < 1100 * 1024; i++) s += chars[Math.floor(r() * chars.length)];
    await put([chain(convs.topic, msg(acct, convs.topic, ++n, { content: '<p>' + s + '</p>' }))]);
  } else {
    let s = '';
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    for (let i = 0; i < 200 * 1024; i++) s += chars[Math.floor(r() * chars.length)];
    await put([chain(convs.topic, msg(acct, convs.topic, ++n, { content: '<p>' + s + '</p>' }))]);
  }

  // Edit (higher version), delete a record, overwrite another.
  const editedChain = chain(convs.space, Object.assign({}, edited, { content: '<p>Edited text</p>', version: edited.version + 60000, properties: { edittime: String(edited.version + 60000) } }));
  const gone = c1[20];
  await put([editedChain], [gone.replyChainId]);
  const over = c1[1];
  await put([chain(over.conversationId, Object.assign({}, over.messageMap[over.replyChainId], { content: '<p>Overwritten twice</p>', version: 1700000999000 }))]);
  // Broadcast mentions of the account (no person mention of it): a team, a tag and @everyone. The
  // activity feed below says why each reached the account. They sit in the untitled group chat,
  // which has no read marker, so they never count as unread.
  const c3 = [];
  const broadcast = {};
  for (const [kind, mri, name] of [['team', convs.space, 'Fixture team ' + acct.seed], ['tag', 'tag:fixture-tag-2', 'Fixture Tag Two'], ['everyone', 'everyone', 'everyone']]) {
    const m = msg(acct, convs.group, ++n, Object.assign({}, pat, { content: '<p><span itemscope itemtype="http://schema.skype.com/Mention" itemid="0">' + name + '</span> broadcast ' + kind + '</p>', properties: props({ mentions: JSON.stringify([{ itemid: 0, mentionType: kind, mri, displayName: name }]) }) }));
    c3.push(chain(convs.group, m));
    broadcast[kind] = m;
  }
  await put(c3);
  rdb.close();

  const cdb = await open('Teams:conversation-manager:react-web-client:' + suffix, [['conversations', 'id']]);
  const tx = cdb.transaction('conversations', 'readwrite');
  const st = tx.objectStore('conversations');
  const mk = (id, type, title, tp, extra) => Object.assign({
    id, type, chatTitle: { shortTitle: title, longTitle: title + ' (long)' }, threadProperties: Object.assign({ topic: title, threadType: type.toLowerCase() }, tp || {}),
    members: [{ id: me, role: 'Admin' }, { id: other, role: 'User' }],
    lastMessageTimeUtc: 1700000100000, parentId: null, teamId: '',
    properties: { consumptionhorizon: '', favorite: 'false' },
  }, extra);
  const horizon = (n0) => ts(n0) + ';' + (ts(n0) + 5000) + ';' + ts(n0);
  // The chat's horizon sits after message 4, so its later messages are newer than the read marker.
  st.put(mk(convs.chat, 'Chat', 'Fixture chat ' + acct.seed, { threadType: 'chat' }, { properties: { consumptionhorizon: horizon(4), favorite: 'true' } }));
  // A channel: its DisplayName is the channel topic; the team's record (below) supplies the team name.
  st.put(mk(convs.topic, 'Topic', 'General', { threadType: 'topic' }, { chatTitle: undefined, threadProperties: { topicThreadTopic: 'General', threadType: 'topic' }, parentId: convs.space, teamId: convs.space, properties: { consumptionhorizon: horizon(30), favorite: 'false' } }));
  st.put(mk(convs.channel2, 'Topic', 'Planning', { threadType: 'topic' }, { chatTitle: undefined, threadProperties: { topic: 'Planning', threadType: 'topic' }, parentId: convs.space, teamId: convs.space, properties: { consumptionhorizon: '0;0;0' } }));
  st.put(mk(convs.space, 'Space', 'Fixture team ' + acct.seed, { threadType: 'space' }, { chatTitle: undefined, threadProperties: { spaceThreadTopic: 'Fixture team ' + acct.seed, threadType: 'space' }, teamId: convs.space, members: [], properties: {} }));
  st.put(mk(convs.meeting, 'Meeting', 'Fixture standup', { threadType: 'meeting' }, { properties: { consumptionhorizon: horizon(2) } }));
  st.put(mk(shared, 'Chat', 'Shared conversation id', { threadType: 'chat' }));
  // A group chat with no title at all: its name comes from the members.
  st.put(mk(convs.group, 'Chat', '', { threadType: 'chat' }, { chatTitle: null, threadProperties: { topic: null, threadType: 'chat' }, members: [{ id: me, role: 'Admin', friendlyName: acct.name }, { id: other, role: 'User', friendlyName: 'Pat Example' }, { id: '8:orgid:00000000-0000-4000-8000-0000000000dd', role: 'User', friendlyName: 'Sam Example' }] }));
  await done(tx);
  cdb.close();


  // Activity feed: one mention, reply and reaction each, read and unread, plus a non-message item.
  const adbf = await open('Teams:activity-manager:react-web-client:' + suffix, [['feed-items', 'activityId']]);
  const ftx = adbf.transaction('feed-items', 'readwrite');
  const fst = ftx.objectStore('feed-items');
  const feed = (i, type, subtype, isRead, src, extra) => fst.put(Object.assign({
    activityId: 'fixture-activity-' + acct.seed + '-' + i, activityType: type, activitySubtype: subtype, activityVersion: '1.0', isRead,
    timestamp: ts(40) + i * 60000, sourceThreadId: src.conversationId, sourceMessageId: src.id, sourceReplyChainId: src.parentMessageId, messageId: src.id,
  }, extra || {}));
  feed(1, 'mentionInChat', 'person', false, mentionOther);
  feed(2, 'mention', 'channel', true, root);
  feed(3, 'reply', 'channel', false, reply);
  feed(4, 'reactionInChat', 'like', false, reacted);
  feed(5, 'reaction', 'heart', true, root);
  feed(6, 'msGraph', 'approvalCompleted', false, { conversationId: '', id: 'graph-message-' + acct.seed, parentMessageId: '' }, { teamsAppId: 'fixture-app-id' });
  feed(7, 'replyToReply', 'channel', true, reply);
  feed(8, 'follow', '', false, poll);
  feed(9, 'mention', 'team', false, broadcast.team);
  feed(10, 'mention', 'tag', true, broadcast.tag);
  feed(11, 'mentionInChat', 'everyone', false, broadcast.everyone);
  await done(ftx);
  adbf.close();

  // Extra managers that are neither typed nor credential-like: read generically, with date, binary
  // and array keys. The first account's calendar-manager also holds a store named like a credential,
  // which must be skipped.
  const kdb = await open('Teams:calendar-manager:react-web-client:' + suffix, [['events', 'id']].concat(acct.big ? [['sessionTokens', 'id']] : []));
  const ktx = kdb.transaction(acct.big ? ['events', 'sessionTokens'] : ['events'], 'readwrite');
  ktx.objectStore('events').put({ id: 'fixture-event-' + acct.seed + '-1', subject: 'Fixture planning', start: new Date(1700000000000), allDay: false });
  ktx.objectStore('events').put({ id: 'fixture-event-' + acct.seed + '-2', subject: 'Fixture holiday', start: new Date(1700006400000), allDay: true });
  if (acct.big) ktx.objectStore('sessionTokens').put({ id: 'decoy', value: 'FIXTURE-SESSION-DECOY' });
  await done(ktx);
  kdb.close();
  const pdb = await open('Teams:pinned-manager:react-web-client:' + suffix, [['pins', 'pinKey']]);
  const ptx = pdb.transaction('pins', 'readwrite');
  ptx.objectStore('pins').put({ pinKey: 'fixture-pin-' + acct.seed, label: 'Fixture pin' });
  ptx.objectStore('pins').put({ pinKey: new Date(1700000000000 + acct.seed * 1000), label: 'Date-keyed pin' });
  ptx.objectStore('pins').put({ pinKey: new Uint8Array([1, 2, 3, acct.seed]), label: 'Binary-keyed pin' });
  ptx.objectStore('pins').put({ pinKey: ['fixture', acct.seed, 'array'], label: 'Array-keyed pin' });
  await done(ptx);
  pdb.close();

  // Decoy credential databases that must never be decoded. The first account only, so the fixture
  // holds three of them: Teams:auth, a token cache under another manager, and a bare keyval store.
  if (acct.big) {
    const adb = await open('Teams:auth:react-web-client:' + suffix, [['tokens', 'id']]);
    const atx = adb.transaction('tokens', 'readwrite');
    atx.objectStore('tokens').put({ id: 'decoy', secret: 'FIXTURE-SECRET-TOKEN' });
    await done(atx);
    adb.close();
    const tdb = await open('Teams:token-cache-manager:react-web-client:' + suffix, [['entries', 'id']]);
    const ttx = tdb.transaction('entries', 'readwrite');
    ttx.objectStore('entries').put({ id: 'decoy', access_token: 'FIXTURE-ACCESS-DECOY' });
    await done(ttx);
    tdb.close();
    const vdb = await open('keyval-store', [['keyval', 'id']]);
    const vtx = vdb.transaction('keyval', 'readwrite');
    vtx.objectStore('keyval').put({ id: 'decoy', value: 'FIXTURE-KEYVAL-DECOY' });
    await done(vtx);
    vdb.close();
  }
  return { chains: n };
};
</script>
